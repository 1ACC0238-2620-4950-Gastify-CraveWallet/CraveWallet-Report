<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1117" viewBox="0 0 1800 1117">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="60" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#18324a">A. Registrar una suscripción y preparar el aviso</text>
<text x="40" y="101" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#18324a">C: comando | Q: consulta | R: respuesta | E: hecho confirmado. Orden propio del escenario.</text>
<rect x="45" y="140" width="330" height="100" fill="#f0f5fa" stroke="#8196a8" stroke-width="2" />
<text x="61" y="176" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#18324a">Cliente</text>
<text x="61" y="214" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#18324a">Aplicación móvil</text>
<polyline points="210,240 210,962" fill="none" stroke="#8196a8" stroke-width="3" stroke-dasharray="8 7"/>
<rect x="485" y="140" width="330" height="100" fill="#f0f5fa" stroke="#8196a8" stroke-width="2" />
<text x="501" y="176" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#18324a">Bounded Context</text>
<text x="501" y="214" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#18324a">Suscripciones</text>
<polyline points="650,240 650,962" fill="none" stroke="#8196a8" stroke-width="3" stroke-dasharray="8 7"/>
<rect x="925" y="140" width="330" height="100" fill="#f0f5fa" stroke="#8196a8" stroke-width="2" />
<text x="941" y="176" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#18324a">Bounded Context</text>
<text x="941" y="214" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#18324a">Premium &amp; Billing</text>
<polyline points="1090,240 1090,962" fill="none" stroke="#8196a8" stroke-width="3" stroke-dasharray="8 7"/>
<rect x="1365" y="140" width="330" height="100" fill="#f0f5fa" stroke="#8196a8" stroke-width="2" />
<text x="1381" y="176" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#18324a">Sistema externo</text>
<text x="1381" y="214" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#18324a">Calendario</text>
<polyline points="1530,240 1530,962" fill="none" stroke="#8196a8" stroke-width="3" stroke-dasharray="8 7"/>
<polyline points="210,373 650,373" fill="none" stroke="#176aa5" stroke-width="3" />
<polygon points="650,373 636.4932934647098,379.52448301166845 636.4932934647098,366.47551698833155" fill="#176aa5"/>
<rect x="218" y="287" width="1551" height="78" fill="white" stroke="white" stroke-width="2" />
<text x="222" y="314" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#176aa5">1 [C] RegisterSubscription</text>
<text x="222" y="345" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#176aa5">Identidad autenticada; nombre, importe, moneda, categoría, ciclo y próxima fecha.</text>
<polyline points="650,474 1090,474" fill="none" stroke="#6557a5" stroke-width="3" />
<polygon points="1090,474 1076.49329346471,480.52448301166845 1076.49329346471,467.47551698833155" fill="#6557a5"/>
<rect x="658" y="388" width="1111" height="78" fill="white" stroke="white" stroke-width="2" />
<text x="662" y="415" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#6557a5">2 [Q] GetPlanAccess</text>
<text x="662" y="446" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#6557a5">userId</text>
<polyline points="1090,575 650,575" fill="none" stroke="#39714e" stroke-width="3" />
<polygon points="650,575 663.5067065352902,568.4755169883315 663.5067065352902,581.5244830116685" fill="#39714e"/>
<rect x="658" y="489" width="1111" height="78" fill="white" stroke="white" stroke-width="2" />
<text x="662" y="516" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#39714e">3 [R] PlanAccess</text>
<text x="662" y="547" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#39714e">Nivel, límite y vigencia. Suscripciones comprueba su cantidad de registros activos.</text>
<polyline points="650,656 722,656 722,678 650,678" fill="none" stroke="#a65018" stroke-width="3" />
<polygon points="650,678 663.5067065352902,671.4755169883315 663.5067065352902,684.5244830116685" fill="#a65018"/>
<rect x="736" y="590" width="1033" height="78" fill="white" stroke="white" stroke-width="2" />
<text x="740" y="617" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#a65018">4 [E] SubscriptionRegistered</text>
<text x="740" y="648" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#a65018">subscriptionId, userId, nextBillingDate; después de confirmar la persistencia.</text>
<polyline points="650,777 210,777" fill="none" stroke="#39714e" stroke-width="3" />
<polygon points="210,777 223.50670653529016,770.4755169883315 223.50670653529016,783.5244830116685" fill="#39714e"/>
<rect x="218" y="691" width="1551" height="78" fill="white" stroke="white" stroke-width="2" />
<text x="222" y="718" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#39714e">5 [R] Registro confirmado</text>
<text x="222" y="749" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#39714e">Suscripción y datos del aviso; calendario todavía no confirmado.</text>
<polyline points="210,878 1530,878" fill="none" stroke="#176aa5" stroke-width="3" />
<polygon points="1530,878 1516.49329346471,884.5244830116685 1516.49329346471,871.4755169883315" fill="#176aa5"/>
<rect x="218" y="792" width="1551" height="78" fill="white" stroke="white" stroke-width="2" />
<text x="222" y="819" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#176aa5">6 [C] Crear recordatorio</text>
<text x="222" y="850" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#176aa5">subscriptionId, título e instante 24 horas antes; requiere permiso del usuario.</text>
<polyline points="1530,979 210,979" fill="none" stroke="#39714e" stroke-width="3" />
<polygon points="210,979 223.50670653529016,972.4755169883315 223.50670653529016,985.5244830116685" fill="#39714e"/>
<rect x="218" y="893" width="1551" height="78" fill="white" stroke="white" stroke-width="2" />
<text x="222" y="920" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#39714e">7 [R] Resultado del calendario</text>
<text x="222" y="951" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#39714e">eventId creado, error o permiso denegado.</text>
<text x="40" y="1027" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#18324a">Rechazo por límite: detener el alta antes del paso 4. El importe original se conserva.</text>
<text x="40" y="1081" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#18324a">Fuente: Gastify; notación adaptada de DDD Crew, Domain Message Flow Modelling. CC BY 4.0.</text>
</svg>