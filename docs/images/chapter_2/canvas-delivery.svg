  <text x="1594.0" y="512.84" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232375">Q: buscar comercios</text>
  <text x="1594.0" y="545.04" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232375">R: MerchantSuggestion</text>
  <text x="1594.0" y="577.24" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232375">ACL: GooglePlacesAdapter</text>
  <text x="1594.0" y="609.4399999999999" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232375" />
  <text x="1594.0" y="641.64" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232375">Suscripciones: Separate Ways</text>
  <text x="1594.0" y="673.84" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232375">El Dashboard compone lecturas, sin intercambio entre</text>
  <text x="1594.0" y="706.04" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232375">agregados.</text>
  <text x="64.0" y="1225.66" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="32.0" font-weight="bold" data-miro-id="3458764686427232377">Assumptions</text>
  <text x="64.0" y="1290.64" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232378">El usuario consigna sus pedidos.</text>
  <text x="64.0" y="1322.8400000000001" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232378">El total refleja los gastos registrados.</text>
  <text x="64.0" y="1355.0400000000002" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232378">Google Places es opcional.</text>
  <text x="844.0" y="1225.66" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="32.0" font-weight="bold" data-miro-id="3458764686427232380">Verification Metrics</text>
  <text x="844.0" y="1290.64" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232381">Acumulado frente a suma del mes.</text>
  <text x="844.0" y="1322.8400000000001" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232381">Duplicados tras reintentar.</text>
  <text x="844.0" y="1355.0400000000002" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232381">Altas con Places no disponible.</text>
  <text x="844.0" y="1387.24" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232381">Sin resultados medidos aún.</text>
  <text x="1644.0" y="1225.66" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="32.0" font-weight="bold" data-miro-id="3458764686427232383">Open Questions</text>
  <text x="1644.0" y="1290.64" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232384">¿Cuándo repetir aviso de exceso?</text>
  <text x="1644.0" y="1322.8400000000001" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232384">¿Recalcular tras editar/eliminar?</text>
  <text x="1644.0" y="1355.0400000000002" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232384">¿Reducir límite bajo el acumulado?</text>
