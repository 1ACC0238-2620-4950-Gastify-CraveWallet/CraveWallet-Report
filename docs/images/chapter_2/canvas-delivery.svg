  <text x="1064.0" y="335.86" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="27.0" font-weight="normal" data-miro-id="3458764686427232359">Evolución: custom built (propuesta)</text>
  <text x="1934.0" y="210.66" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="32.0" font-weight="bold" data-miro-id="3458764686427232361">Domain Roles</text>
