  <text x="64.0" y="415.66" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="32.0" font-weight="bold" data-miro-id="3458764686427232364">Inbound Communication</text>
  <text x="64.0" y="480.64" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232365">Móvil (cliente)</text>
  <text x="64.0" y="512.84" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232365">C: RegisterExpense, editar, eliminar, cambiar límite</text>
  <text x="64.0" y="545.04" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232365">Q: historial y resumen</text>
  <text x="64.0" y="577.24" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232365">R: total, límite, saldo y exceso</text>
  <text x="784.0" y="415.66" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="32.0" font-weight="bold" data-miro-id="3458764686427232367">Ubiquitous Language</text>
  <text x="784.0" y="480.26" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="27.0" font-weight="normal" data-miro-id="3458764686427232368">Gasto: importe registrado por pedido.</text>
  <text x="784.0" y="511.31" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="27.0" font-weight="normal" data-miro-id="3458764686427232368">Comercio: negocio asociado.</text>
  <text x="784.0" y="542.36" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="27.0" font-weight="normal" data-miro-id="3458764686427232368">Período: mes del gasto.</text>
  <text x="784.0" y="573.41" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="27.0" font-weight="normal" data-miro-id="3458764686427232368">Límite: tope elegido.</text>
  <text x="784.0" y="604.46" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="27.0" font-weight="normal" data-miro-id="3458764686427232368">Exceso: acumulado superior al tope.</text>
  <text x="784.0" y="810.66" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="32.0" font-weight="bold" data-miro-id="3458764686427232371">Business Decisions</text>
  <text x="784.0" y="874.76" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="27.0" font-weight="normal" data-miro-id="3458764686427232372">DeliveryExpense y MonthlyBudget son agregados del mismo</text>
  <text x="784.0" y="905.81" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="27.0" font-weight="normal" data-miro-id="3458764686427232372">contexto.</text>
  <text x="784.0" y="936.86" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="27.0" font-weight="normal" data-miro-id="3458764686427232372">Contar cada gasto una sola vez.</text>
  <text x="784.0" y="967.91" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="27.0" font-weight="normal" data-miro-id="3458764686427232372">E: DeliveryExpenseRegistered / MonthlyLimitExceeded.</text>
  <text x="784.0" y="998.96" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="27.0" font-weight="normal" data-miro-id="3458764686427232372">Permitir comercio manual.</text>
  <text x="1594.0" y="415.66" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="32.0" font-weight="bold" data-miro-id="3458764686427232374">Outbound Communication</text>
