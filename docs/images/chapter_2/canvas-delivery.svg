  <text x="40.0" y="66.7" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="40.0" font-weight="bold" data-miro-id="3458764686427232351">Bounded Context Canvas | Delivery Expense Management</text>
  <text x="40.0" y="122.38" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="26.0" font-weight="normal" data-miro-id="3458764686427232352">Gestión de gastos de delivery | Diseño propuesto: C comando; Q consulta; R respuesta; E evento</text>
  <text x="40.0" y="1494.86" fill="#595959" font-family="Arial,sans-serif" font-size="22.0" font-weight="normal" data-miro-id="3458764686427232353">Gastify. Adaptación en Miro del canvas v5: https://github.com/ddd-crew/bounded-context-canvas | CC BY 4.0</text>
  <text x="64.0" y="210.66" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="32.0" font-weight="bold" data-miro-id="3458764686427232355">Purpose</text>
  <text x="64.0" y="276.4" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="30.0" font-weight="normal" data-miro-id="3458764686427232356">Registrar pedidos pagados y comparar el gasto acumulado con el</text>
