  <text x="40.0" y="66.7" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="40.0" font-weight="bold" data-miro-id="3458764686427232317">Bounded Context Canvas | Subscription Management</text>
  <text x="40.0" y="122.38" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="26.0" font-weight="normal" data-miro-id="3458764686427232318">Gestión de suscripciones | Diseño propuesto: C comando; Q consulta; R respuesta; E evento</text>
  <text x="40.0" y="1494.86" fill="#595959" font-family="Arial,sans-serif" font-size="22.0" font-weight="normal" data-miro-id="3458764686427232319">Gastify. Adaptación en Miro del canvas v5: https://github.com/ddd-crew/bounded-context-canvas | CC BY 4.0</text>
  <text x="64.0" y="210.66" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="32.0" font-weight="bold" data-miro-id="3458764686427232321">Purpose</text>
  <text x="64.0" y="276.4" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="30.0" font-weight="normal" data-miro-id="3458764686427232322">Anticipar renovaciones y estimar en soles los compromisos</text>
  <text x="64.0" y="310.9" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="30.0" font-weight="normal" data-miro-id="3458764686427232322">recurrentes que registra el usuario.</text>
  <text x="1064.0" y="210.66" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="32.0" font-weight="bold" data-miro-id="3458764686427232324">Strategic Classification</text>
  <text x="1064.0" y="273.76" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="27.0" font-weight="normal" data-miro-id="3458764686427232325">Core</text>
  <text x="1064.0" y="304.81" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="27.0" font-weight="normal" data-miro-id="3458764686427232325">Modelo de negocio: engagement</text>
  <text x="1064.0" y="335.86" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="27.0" font-weight="normal" data-miro-id="3458764686427232325">Evolución: custom built (propuesta)</text>
  <text x="1934.0" y="210.66" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="32.0" font-weight="bold" data-miro-id="3458764686427232327">Domain Roles</text>
  <text x="1934.0" y="275.26" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="27.0" font-weight="normal" data-miro-id="3458764686427232328">Execution: ciclo</text>
  <text x="1934.0" y="306.31" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="27.0" font-weight="normal" data-miro-id="3458764686427232328">Analysis: portafolio</text>
  <text x="64.0" y="415.66" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="32.0" font-weight="bold" data-miro-id="3458764686427232330">Inbound Communication</text>
  <text x="64.0" y="480.64" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232331">Móvil (cliente)</text>
  <text x="64.0" y="512.84" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232331">C: RegisterSubscription, editar, cancelar</text>
  <text x="64.0" y="545.04" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232331">Q: detalle y portafolio</text>
  <text x="64.0" y="577.24" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232331">R: registro, estado, resumen y datos del aviso</text>
  <text x="784.0" y="415.66" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="32.0" font-weight="bold" data-miro-id="3458764686427232333">Ubiquitous Language</text>
  <text x="784.0" y="480.26" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="27.0" font-weight="normal" data-miro-id="3458764686427232334">Suscripción: registro de un compromiso con un tercero.</text>
  <text x="784.0" y="511.31" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="27.0" font-weight="normal" data-miro-id="3458764686427232334">Importe original: monto y moneda.</text>
  <text x="784.0" y="542.36" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="27.0" font-weight="normal" data-miro-id="3458764686427232334">Estimación PEN: valor de referencia.</text>
  <text x="784.0" y="573.41" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="27.0" font-weight="normal" data-miro-id="3458764686427232334">Cancelada: estado del registro local.</text>
  <text x="784.0" y="810.66" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="32.0" font-weight="bold" data-miro-id="3458764686427232336">Business Decisions</text>
  <text x="784.0" y="874.26" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="27.0" font-weight="normal" data-miro-id="3458764686427232337">Comprobar límite antes del alta.</text>
  <text x="784.0" y="905.31" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="27.0" font-weight="normal" data-miro-id="3458764686427232337">Conservar moneda original e historial.</text>
  <text x="784.0" y="936.36" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="27.0" font-weight="normal" data-miro-id="3458764686427232337">E: SubscriptionRegistered / SubscriptionCancelled.</text>
  <text x="784.0" y="967.41" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="27.0" font-weight="normal" data-miro-id="3458764686427232337">El móvil ejecuta el aviso 24 h antes, con permiso.</text>
  <text x="1594.0" y="415.66" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="32.0" font-weight="bold" data-miro-id="3458764686427232339">Outbound Communication</text>
  <text x="1594.0" y="480.64" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232341">Premium &amp; Billing (U; proveedor)</text>
  <text x="1594.0" y="512.84" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232341">Q: GetPlanAccess(userId)</text>
  <text x="1594.0" y="545.04" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232341">R: nivel, límite y vigencia</text>
  <text x="1594.0" y="577.24" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232341">Customer/Supplier propuesto</text>
  <text x="1594.0" y="609.4399999999999" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232341" />
  <text x="1594.0" y="641.64" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232341">ExchangeRate-API (U; externo)</text>
  <text x="1594.0" y="673.84" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232341">Q/R: cotización USD/PEN y fecha</text>
  <text x="1594.0" y="706.04" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232341">ACL: ExchangeRateApiAdapter</text>
  <text x="64.0" y="1225.66" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="32.0" font-weight="bold" data-miro-id="3458764686427232343">Assumptions</text>
  <text x="64.0" y="1290.64" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232344">El usuario mantiene sus datos.</text>
  <text x="64.0" y="1322.8400000000001" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232344">La conversión es una estimación.</text>
  <text x="64.0" y="1355.0400000000002" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232344">El dispositivo admite recordatorios.</text>
  <text x="844.0" y="1225.66" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="32.0" font-weight="bold" data-miro-id="3458764686427232346">Verification Metrics</text>
  <text x="844.0" y="1290.64" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232347">Errores de anticipación del aviso.</text>
  <text x="844.0" y="1322.8400000000001" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232347">Avisos que persisten al cancelar.</text>
  <text x="844.0" y="1355.0400000000002" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232347">Cambios que afectan a Premium.</text>
  <text x="844.0" y="1387.24" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232347">Sin resultados medidos aún.</text>
  <text x="1644.0" y="1225.66" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="32.0" font-weight="bold" data-miro-id="3458764686427232349">Open Questions</text>
  <text x="1644.0" y="1290.64" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232350">¿Se confirma Free = cinco activos?</text>
  <text x="1644.0" y="1322.8400000000001" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232350">¿Exceso al volver a Free?</text>
  <text x="1644.0" y="1355.0400000000002" fill="#1a1a1a" font-family="Arial,sans-serif" font-size="28.0" font-weight="normal" data-miro-id="3458764686427232350">¿Hora, zona y reprogramación?</text>
