<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1450" viewBox="0 0 1800 1450">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="60" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#18324a">Bounded Context Canvas | Subscription Management</text>
<text x="40" y="101" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#18324a">Gestión de suscripciones | Propuesta de diseño | C: comando; Q: consulta; R: respuesta; E: evento</text>
<rect x="40" y="135" width="760" height="235" fill="#f5f8fb" stroke="#8196a8" stroke-width="2" />
<text x="56" y="177" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#18324a">Purpose / Propósito</text>
<text x="56" y="220" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Anticipar renovaciones y estimar en soles los compromisos</text>
<text x="56" y="251" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">recurrentes que registra el usuario.</text>
<rect x="800" y="135" width="555" height="235" fill="#f5f8fb" stroke="#8196a8" stroke-width="2" />
<text x="816" y="177" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#18324a">Strategic Classification</text>
<text x="816" y="220" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Core</text>
<text x="816" y="251" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Modelo de negocio: engagement</text>
<text x="816" y="282" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Evolución: custom built (propuesta)</text>
<rect x="1355" y="135" width="405" height="235" fill="#f5f8fb" stroke="#8196a8" stroke-width="2" />
<text x="1371" y="177" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#18324a">Domain Roles</text>
<text x="1371" y="220" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Execution: ciclo del registro</text>
<text x="1371" y="251" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Analysis: portafolio y estimación</text>
<rect x="40" y="370" width="565" height="715" fill="#edf6fd" stroke="#8196a8" stroke-width="2" />
<text x="56" y="412" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#18324a">Inbound Communication</text>
<text x="56" y="455" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Móvil (cliente)</text>
<text x="56" y="486" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">C: RegisterSubscription, editar, cancelar</text>
<text x="56" y="517" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Q: detalle y portafolio</text>
<text x="56" y="548" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">R: registro, estado, resumen y datos del aviso</text>
<rect x="605" y="370" width="550" height="350" fill="#fffdf3" stroke="#8196a8" stroke-width="2" />
<text x="621" y="412" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#18324a">Ubiquitous Language</text>
<text x="621" y="455" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Suscripción: registro de un compromiso con un</text>
<text x="621" y="486" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">tercero.</text>
<text x="621" y="517" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Importe original: monto y moneda.</text>
<text x="621" y="548" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Estimación PEN: valor de referencia.</text>
<text x="621" y="579" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Cancelada: estado del registro local.</text>
<rect x="605" y="720" width="550" height="365" fill="#f5f0fc" stroke="#8196a8" stroke-width="2" />
<text x="621" y="762" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#18324a">Business Decisions</text>
<text x="621" y="805" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Comprobar límite antes del alta.</text>
<text x="621" y="836" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Conservar moneda original e historial.</text>
<text x="621" y="867" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">E: SubscriptionRegistered /</text>
<text x="621" y="898" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">SubscriptionCancelled.</text>
<text x="621" y="929" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">El móvil ejecuta el aviso 24 h antes, con</text>
<text x="621" y="960" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">permiso.</text>
<rect x="1155" y="370" width="605" height="715" fill="#f0f8f2" stroke="#8196a8" stroke-width="2" />
<text x="1171" y="412" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#18324a">Outbound Communication</text>
<text x="1171" y="455" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Premium &amp; Billing (U; proveedor)</text>
<text x="1171" y="486" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Q: GetPlanAccess(userId)</text>
<text x="1171" y="517" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">R: nivel, límite y vigencia</text>
<text x="1171" y="548" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Customer/Supplier propuesto</text>
<text x="1171" y="579" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a"></text>
<text x="1171" y="610" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">ExchangeRate-API (U; externo)</text>
<text x="1171" y="641" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Q/R: cotización USD/PEN y fecha</text>
<text x="1171" y="672" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">ACL: ExchangeRateApiAdapter</text>
<rect x="40" y="1085" width="565" height="270" fill="#f0f5fa" stroke="#8196a8" stroke-width="2" />
<text x="56" y="1127" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#18324a">Assumptions</text>
<text x="56" y="1170" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">El usuario mantiene sus datos.</text>
<text x="56" y="1201" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">La conversión es una estimación.</text>
<text x="56" y="1232" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">El dispositivo admite recordatorios.</text>
<rect x="605" y="1085" width="550" height="270" fill="#f0f5fa" stroke="#8196a8" stroke-width="2" />
<text x="621" y="1127" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#18324a">Verification Metrics</text>
<text x="621" y="1170" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Errores de anticipación del aviso.</text>
<text x="621" y="1201" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Avisos que persisten al cancelar.</text>
<text x="621" y="1232" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Cambios que afectan a Premium.</text>
<text x="621" y="1263" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Sin resultados medidos aún.</text>
<rect x="1155" y="1085" width="605" height="270" fill="#f0f5fa" stroke="#8196a8" stroke-width="2" />
<text x="1171" y="1127" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#18324a">Open Questions</text>
<text x="1171" y="1170" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">¿Se confirma Free = cinco activos?</text>
<text x="1171" y="1201" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">¿Exceso al volver a Free?</text>
<text x="1171" y="1232" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">¿Hora, zona y reprogramación?</text>
<text x="40" y="1414" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#18324a">Fuente: Gastify; adaptación del Bounded Context Canvas v5 de DDD Crew. CC BY 4.0. Sin métricas ejecutadas.</text>
</svg>