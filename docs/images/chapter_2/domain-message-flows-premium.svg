<text x="495" y="933" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#18324a">Premium &amp; Billing</text>
<polyline points="650,1012 650,1440" fill="none" stroke="#a6b4c1" stroke-width="3" stroke-dasharray="8 6"/>
<rect x="920" y="920" width="340" height="92" fill="#edf3f8" stroke="#7990a5" stroke-width="2"/>
<text x="935" y="933" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#18324a">Stripe</text>
<polyline points="1090,1012 1090,1440" fill="none" stroke="#a6b4c1" stroke-width="3" stroke-dasharray="8 6"/>
<polyline points="210,1103 650,1103" fill="none" stroke="#1467a1" stroke-width="3"/>
<polygon points="650,1103 636.4932934647098,1109.5244830116685 636.4932934647098,1096.4755169883315" fill="#1467a1"/>
<rect x="218" y="1047" width="1250" height="50" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<text x="222" y="1050" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#1467a1">1 [C] Cancelar renovación</text>
<text x="222" y="1077" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#1467a1">userId; conservar período pagado</text>
<polyline points="650,1183 1090,1183" fill="none" stroke="#1467a1" stroke-width="3"/>
<polygon points="1090,1183 1076.49329346471,1189.5244830116685 1076.49329346471,1176.4755169883315" fill="#1467a1"/>
<rect x="658" y="1127" width="1114" height="50" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<text x="662" y="1130" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#1467a1">2 [C] Cancelar al fin del período</text>
<text x="662" y="1157" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#1467a1">solicitud y confirmación con fecha de vigencia</text>
<polyline points="1090,1263 650,1263" fill="none" stroke="#a34f17" stroke-width="3"/>
<polygon points="650,1263 663.5067065352902,1256.4755169883315 663.5067065352902,1269.5244830116685" fill="#a34f17"/>
<rect x="658" y="1207" width="1114" height="50" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<text x="662" y="1210" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#a34f17">3 [E] customer.subscription.deleted</text>
<text x="662" y="1237" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#a34f17">notificación verificada del fin; reconciliar estado</text>
<polyline points="650,1330 735,1330 735,1352 650,1352" fill="none" stroke="#a34f17" stroke-width="3"/>
<polygon points="650,1352 663.5067065352902,1345.4755169883315 663.5067065352902,1358.5244830116685" fill="#a34f17"/>
<rect x="751" y="1287" width="1021" height="50" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<text x="755" y="1290" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#a34f17">4 [E] PlanDowngradedToFree</text>
<text x="755" y="1317" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#a34f17">planId, userId; conservar trazabilidad de facturación</text>
<polyline points="210,1423 650,1423" fill="none" stroke="#5365a0" stroke-width="3"/>
<polygon points="650,1423 636.4932934647098,1429.5244830116685 636.4932934647098,1416.4755169883315" fill="#5365a0"/>
<rect x="218" y="1367" width="1250" height="50" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<text x="222" y="1370" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#5365a0">5 [Q] Consultar plan / recibir respuesta</text>
<text x="222" y="1397" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#5365a0">Free; tratamiento del exceso pendiente del equipo</text>
<text x="40" y="1561" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#18324a">Fuente: Gastify; notación adaptada de DDD Crew, Domain Message Flow Modelling. CC BY-SA 4.0.</text>
