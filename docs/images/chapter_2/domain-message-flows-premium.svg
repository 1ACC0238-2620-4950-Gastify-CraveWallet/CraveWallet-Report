<rect x="920" y="180" width="340" height="92" fill="#edf3f8" stroke="#7990a5" stroke-width="2"/>
<text x="935" y="193" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#18324a">Stripe</text>
<polyline points="1090,272 1090,780" fill="none" stroke="#a6b4c1" stroke-width="3" stroke-dasharray="8 6"/>
<polyline points="210,363 650,363" fill="none" stroke="#1467a1" stroke-width="3"/>
<polygon points="650,363 636.4932934647098,369.52448301166845 636.4932934647098,356.47551698833155" fill="#1467a1"/>
<rect x="218" y="307" width="1250" height="50" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<text x="222" y="310" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#1467a1">1 [C] Iniciar checkout</text>
<text x="222" y="337" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#1467a1">userId y precio configurado</text>
<polyline points="650,443 1090,443" fill="none" stroke="#1467a1" stroke-width="3"/>
<polygon points="1090,443 1076.49329346471,449.52448301166845 1076.49329346471,436.47551698833155" fill="#1467a1"/>
<rect x="658" y="387" width="1114" height="50" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<text x="662" y="390" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#1467a1">2 [C] Crear sesión de suscripción</text>
<text x="662" y="417" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#1467a1">correlación de usuario, cliente y operación</text>
<polyline points="1090,523 210,523" fill="none" stroke="#476f50" stroke-width="3"/>
<polygon points="210,523 223.50670653529016,516.4755169883315 223.50670653529016,529.5244830116685" fill="#476f50"/>
<rect x="218" y="467" width="1250" height="50" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<text x="222" y="470" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#476f50">3 [R] Sesión de checkout (vía backend)</text>
<text x="222" y="497" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#476f50">el usuario completa el pago; acceso aún pendiente</text>
<polyline points="1090,603 650,603" fill="none" stroke="#a34f17" stroke-width="3"/>
<polygon points="650,603 663.5067065352902,596.4755169883315 663.5067065352902,609.5244830116685" fill="#a34f17"/>
<rect x="658" y="547" width="1114" height="50" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<text x="662" y="550" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#a34f17">4 [E] invoice.paid (externo)</text>
<text x="662" y="577" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#a34f17">eventId, factura y suscripción; verificar y reconciliar</text>
<polyline points="650,670 735,670 735,692 650,692" fill="none" stroke="#a34f17" stroke-width="3"/>
<polygon points="650,692 663.5067065352902,685.4755169883315 663.5067065352902,698.5244830116685" fill="#a34f17"/>
<rect x="751" y="627" width="1021" height="50" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<text x="755" y="630" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#a34f17">5 [E] PlanUpgradedToPremium</text>
<text x="755" y="657" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#a34f17">Free pasa a Premium; una renovación solo actualiza vigencia</text>
<polyline points="210,763 650,763" fill="none" stroke="#5365a0" stroke-width="3"/>
<polygon points="650,763 636.4932934647098,769.5244830116685 636.4932934647098,756.4755169883315" fill="#5365a0"/>
<rect x="218" y="707" width="1250" height="50" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<text x="222" y="710" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#5365a0">6 [Q] Consultar plan / recibir respuesta</text>
<text x="222" y="737" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#5365a0">nivel y período confirmado; no solo retorno del checkout</text>
<text x="40" y="870" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="29" font-weight="bold" fill="#18324a">D. Cancelar renovación y volver a Free</text>
