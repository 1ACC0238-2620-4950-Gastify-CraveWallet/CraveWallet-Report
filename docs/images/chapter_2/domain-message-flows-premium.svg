<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1630" viewBox="0 0 1800 1630">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="25" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#18324a">Domain Message Flows | Premium</text>
<text x="40" y="77" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#18324a">El checkout no confirma un pago. El webhook externo se verifica antes de cambiar el acceso.</text>
<text x="40" y="130" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="29" font-weight="bold" fill="#18324a">C. Activar o renovar el plan propio</text>
<rect x="40" y="180" width="340" height="92" fill="#edf3f8" stroke="#7990a5" stroke-width="2"/>
<text x="55" y="193" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#18324a">Aplicación móvil</text>
<polyline points="210,272 210,780" fill="none" stroke="#a6b4c1" stroke-width="3" stroke-dasharray="8 6"/>
<rect x="480" y="180" width="340" height="92" fill="#edf3f8" stroke="#7990a5" stroke-width="2"/>
<text x="495" y="193" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#18324a">Premium &amp; Billing</text>
