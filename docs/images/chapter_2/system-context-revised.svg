<text x="666" y="526" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#18324a">Sistema de software</text>
<text x="666" y="564" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#18324a">CraveWallet</text>
<text x="666" y="607" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Registra suscripciones y delivery; estima</text>
<text x="666" y="638" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">importes en soles, prepara avisos y administra</text>
<text x="666" y="669" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">su plan propio.</text>
