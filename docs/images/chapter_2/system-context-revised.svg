<text x="40" y="25" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#18324a">C4 | Contexto del sistema CraveWallet</text>
<text x="40" y="77" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#18324a">El sistema incluye cliente móvil y backend. Se muestran usuarios y sistemas externos.</text>
<rect x="620" y="145" width="550" height="160" fill="#edf3f8" stroke="#7990a5" stroke-width="2"/>
