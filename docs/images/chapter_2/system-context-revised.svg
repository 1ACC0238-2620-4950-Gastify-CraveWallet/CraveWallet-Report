<text x="40" y="1197" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#18324a">Stripe notifica al backend. Los contratos y cobros de los servicios registrados quedan fuera del sistema.</text>
<text x="40" y="1251" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#18324a">Fuente: Gastify. Propuesta de diseño; implementación y pruebas pendientes.</text>
