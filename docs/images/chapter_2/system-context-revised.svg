<text x="40" y="101" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#18324a">Nivel 1: personas y sistemas. CraveWallet incluye el cliente móvil y el backend.</text>
<rect x="650" y="140" width="540" height="175" fill="#f0f5fa" stroke="#8196a8" stroke-width="2" />
<text x="666" y="176" font-family="Arial,sans-serif" font-size="21" font-weight="normal" fill="#18324a">Persona</text>
<text x="666" y="214" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#18324a">Usuario</text>
<text x="666" y="257" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Estudiante o profesional joven que controla</text>
<text x="666" y="288" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">compromisos y gastos.</text>
