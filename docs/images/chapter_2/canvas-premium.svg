<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1450" viewBox="0 0 1800 1450">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="60" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#18324a">Bounded Context Canvas | Premium &amp; Billing</text>
<text x="40" y="101" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#18324a">Plan y facturación de CraveWallet | Propuesta de diseño | C: comando; Q: consulta; R: respuesta; E: evento</text>
<rect x="40" y="135" width="760" height="235" fill="#f5f8fb" stroke="#8196a8" stroke-width="2" />
<text x="56" y="177" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#18324a">Purpose / Propósito</text>
<text x="56" y="220" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Mantener el nivel de acceso y su vigencia según la facturación</text>
<text x="56" y="251" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">confirmada del propio producto.</text>
<rect x="800" y="135" width="555" height="235" fill="#f5f8fb" stroke="#8196a8" stroke-width="2" />
<text x="816" y="177" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#18324a">Strategic Classification</text>
<text x="816" y="220" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Generic</text>
<text x="816" y="251" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Modelo de negocio: revenue</text>
<text x="816" y="282" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Evolución: product (Stripe) con reglas propias</text>
<rect x="1355" y="135" width="405" height="235" fill="#f5f8fb" stroke="#8196a8" stroke-width="2" />
<text x="1371" y="177" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#18324a">Domain Roles</text>
<text x="1371" y="220" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Execution: acceso y vigencia</text>
<text x="1371" y="251" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Gateway: traducción de facturación</text>
<rect x="40" y="370" width="565" height="715" fill="#edf6fd" stroke="#8196a8" stroke-width="2" />
<text x="56" y="412" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#18324a">Inbound Communication</text>
<text x="56" y="455" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Móvil (cliente)</text>
<text x="56" y="486" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">C: iniciar checkout, cancelar renovación</text>
<text x="56" y="517" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Q/R: acceso e historial</text>
<text x="56" y="548" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a"></text>
<text x="56" y="579" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Suscripciones (D; cliente)</text>
<text x="56" y="610" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Q/R: GetPlanAccess / PlanAccess</text>
<text x="56" y="641" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Customer/Supplier propuesto</text>
<text x="56" y="672" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a"></text>
<text x="56" y="703" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Stripe (U; externo)</text>
<text x="56" y="734" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">E: invoice.paid / customer.subscription.deleted</text>
<text x="56" y="765" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">ACL verifica y traduce.</text>
<rect x="605" y="370" width="550" height="350" fill="#fffdf3" stroke="#8196a8" stroke-width="2" />
<text x="621" y="412" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#18324a">Ubiquitous Language</text>
<text x="621" y="455" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Free: nivel gratuito con límite.</text>
<text x="621" y="486" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Premium: acceso pagado.</text>
<text x="621" y="517" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Vigencia: intervalo cubierto.</text>
<text x="621" y="548" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Pago confirmado: resultado verificado.</text>
<text x="621" y="579" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Cancelación: fin de la renovación propia.</text>
<rect x="605" y="720" width="550" height="365" fill="#f5f0fc" stroke="#8196a8" stroke-width="2" />
<text x="621" y="762" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#18324a">Business Decisions</text>
<text x="621" y="805" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Activar tras pago verificado.</text>
<text x="621" y="836" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">No repetir evento externo.</text>
<text x="621" y="867" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Renovar actualiza la vigencia.</text>
<text x="621" y="898" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Cancelar conserva período pagado.</text>
<text x="621" y="929" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">E: PlanUpgradedToPremium /</text>
<text x="621" y="960" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">PlanDowngradedToFree.</text>
<rect x="1155" y="370" width="605" height="715" fill="#f0f8f2" stroke="#8196a8" stroke-width="2" />
<text x="1171" y="412" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#18324a">Outbound Communication</text>
<text x="1171" y="455" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Stripe (U; externo)</text>
<text x="1171" y="486" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">C/R: crear checkout / sesión</text>
<text x="1171" y="517" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">C/R: cancelar renovación / vigencia</text>
<text x="1171" y="548" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Q/R: reconciliar estado</text>
<text x="1171" y="579" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">ACL: StripeGatewayAdapter</text>
<text x="1171" y="610" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a"></text>
<text x="1171" y="641" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Las respuestas a consultas entrantes pertenecen a la</text>
<text x="1171" y="672" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">misma colaboración.</text>
<rect x="40" y="1085" width="565" height="270" fill="#f0f5fa" stroke="#8196a8" stroke-width="2" />
<text x="56" y="1127" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#18324a">Assumptions</text>
<text x="56" y="1170" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Facturación recurrente de prueba.</text>
<text x="56" y="1201" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Precio y beneficios son propuestas.</text>
<text x="56" y="1232" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Stripe provee estado de facturación.</text>
<rect x="605" y="1085" width="550" height="270" fill="#f0f5fa" stroke="#8196a8" stroke-width="2" />
<text x="621" y="1127" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#18324a">Verification Metrics</text>
<text x="621" y="1170" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Activaciones sin confirmación.</text>
<text x="621" y="1201" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Acceso frente a vigencia.</text>
<text x="621" y="1232" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Transiciones duplicadas.</text>
<text x="621" y="1263" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">Sin resultados medidos aún.</text>
<rect x="1155" y="1085" width="605" height="270" fill="#f0f5fa" stroke="#8196a8" stroke-width="2" />
<text x="1171" y="1127" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#18324a">Open Questions</text>
<text x="1171" y="1170" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">¿Pago fallido y reembolso?</text>
<text x="1171" y="1201" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">¿Recuperación de webhooks?</text>
<text x="1171" y="1232" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#18324a">¿Exceso al volver a Free?</text>
<text x="40" y="1414" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#18324a">Fuente: Gastify; adaptación del Bounded Context Canvas v5 de DDD Crew. CC BY 4.0. Sin métricas ejecutadas.</text>
</svg>