<text x="54" y="760" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="24" font-weight="normal" fill="#18324a">subscriptions 1 → 0..* subscription_charges. La caché es una dependencia de consulta.</text>
<text x="54" y="805" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#18324a">Importe original ≥ 0; rate &gt; 0. Un cobro previsto no se registra como confirmado.</text>
<text x="40" y="931" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#18324a">Fuente: Gastify. Propuesta de diseño; implementación y pruebas pendientes.</text>
