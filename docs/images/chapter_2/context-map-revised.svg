<text x="40" y="77" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#18324a">U: upstream. D: downstream. Las flechas muestran influencia del modelo, no peticiones HTTP.</text>
