<text x="645" y="551" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#18324a">Premium &amp; Billing [D / U]</text>
<text x="645" y="590" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#18324a">Generic. D de Stripe; U de Suscripciones. Nivel,</text>
<text x="645" y="618" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#18324a">vigencia y límite del plan propio.</text>
