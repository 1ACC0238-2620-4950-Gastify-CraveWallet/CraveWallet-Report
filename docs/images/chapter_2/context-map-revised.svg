<text x="1235" y="590" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#18324a">Supporting. Gastos y presupuesto mensual.</text>
<text x="1235" y="618" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#18324a">Comercio manual o sugerido.</text>
