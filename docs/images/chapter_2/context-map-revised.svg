<text x="55" y="590" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#18324a">Core. Portafolio y renovaciones. Consume</text>
<text x="55" y="618" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#18324a">acceso de Premium. Conserva su propio</text>
<text x="55" y="646" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#18324a">modelo.</text>
