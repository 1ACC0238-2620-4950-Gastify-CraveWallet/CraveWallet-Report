<text x="60" y="987" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#18324a">Suscripciones / Gastos: Separate Ways para sus modelos.</text>
<text x="60" y="1030" dominant-baseline="text-before-edge" font-family="Arial, sans-serif" font-size="23" font-weight="normal" fill="#18324a">El Dashboard compone consultas. Compartir userId no establece un Shared Kernel ni una Partnership.</text>
