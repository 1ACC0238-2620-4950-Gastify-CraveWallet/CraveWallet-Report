<textArea id="m3458764686584755108" data-miro-id="3458764686584755108" x="140" y="148" width="1760" height="33" fill="#18324a" font-family="arial" font-size="23" text-align="left">PK: clave primaria. FK: clave foránea local. user_id: referencia al propietario autenticado.</textArea>
<textArea id="m3458764686584755109" data-miro-id="3458764686584755109" x="154" y="830.5" width="1746" height="34" fill="#18324a" font-family="arial" font-size="24" text-align="left">subscriptions 1 → 0..* subscription_charges. La caché es una dependencia de consulta.</textArea>
