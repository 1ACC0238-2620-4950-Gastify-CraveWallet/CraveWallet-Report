<textArea id="m3458764686584755112" data-miro-id="3458764686584755112" x="140" y="1003.5" width="1760" height="30" fill="#18324a" font-family="arial" font-size="21" text-align="left">Fuente: Gastify. Propuesta de diseño; implementación y pruebas pendientes.</textArea>
